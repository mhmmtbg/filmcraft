name: Release (Windows + Android)

# Builds the Windows installer/exe and the Android APK and attaches them to a GitHub release.
#
#   - push a tag (`git tag v0.7.0 && git push origin v0.7.0`): release <tag>
#   - push to the `release-builds` branch: release v<Cargo.toml version>
#   - push to the `android-ci` branch: only the Android build, no release (to check a fix)
#   - or run it from the Actions tab
#
# Uses only GitHub-hosted standard runners, so it works in forks without the org's macOS runners
# or signing secrets (builds are then unsigned / signed with a throwaway Android key). A failed
# Android build reports its compiler errors as annotations on the job (readable in the job's
# summary and through the checks API, without downloading the log).
#
# Optional secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD  one key for every APK, so new versions
#                                                       install over old ones
#   WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD   Authenticode (see packaging/windows/sign.ps1)

on:
  push:
    tags: ["v*"]
    branches: [release-builds, android-ci]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (empty: v<Cargo.toml version>)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-windows-android-${{ github.ref }}
  cancel-in-progress: false

env:
  CRAFT_FONTS_REF: abb83316d96aa59c1cf64784289e378fe9fa5695
  # Pinned Android toolchain, installed into a fresh SDK so the runner image's other versions
  # (newer build-tools, NDKs) can't change the build.
  ANDROID_PLATFORM: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_NDK: "26.3.11579264"

jobs:
  windows:
    name: Windows x64 (.exe, .msi, portable .zip)
    if: github.ref != 'refs/heads/android-ci'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build and package
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          DIST: ${{ github.workspace }}/dist/release
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          pwsh packaging/windows/package.ps1 -Arch x64
          # The bare app as well, for people who just want filmcraft.exe.
          $v = (Get-ChildItem dist/release/*.msi | Select-Object -First 1).BaseName -replace '^filmcraft-(.+)-windows-x64$', '$1'
          Copy-Item target/windows-package/x64/filmcraft.exe "dist/release/filmcraft-$v-windows-x64.exe"
          Get-ChildItem dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: dist/release/*
          if-no-files-found: error

  android:
    name: Android arm64 (.apk)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # plain text, so the error report below can parse the log
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64
          workspaces: apps/filmcraft-android -> ../../target
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK (platform ${{ env.ANDROID_PLATFORM }}, build-tools ${{ env.ANDROID_BUILD_TOOLS }}, NDK ${{ env.ANDROID_NDK }})
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" --install "platforms;android-$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" "ndk;$ANDROID_NDK" > /dev/null
          ls "$SDK" "$SDK/build-tools" "$SDK/platforms" "$SDK/ndk"
          test -x "$SDK/build-tools/$ANDROID_BUILD_TOOLS/aapt"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_NDK_ROOT=$SDK/ndk/$ANDROID_NDK"
            echo "ANDROID_NDK_HOME=$SDK/ndk/$ANDROID_NDK"
          } >> "$GITHUB_ENV"
      - name: Install cargo-apk and ImageMagick
        run: |
          cargo install cargo-apk --version 0.10.0 --locked
          command -v magick || command -v convert || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; }
      - name: Signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a throwaway key, so the next one cannot install over it."
          fi
      - name: Build and package
        id: build
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: |
          set -o pipefail
          packaging/android/package.sh 2>&1 | tee "$RUNNER_TEMP/android-build.log"
      - name: Report build errors
        if: failure() && steps.build.outcome == 'failure'
        run: python3 packaging/android/report_errors.py "$RUNNER_TEMP/android-build.log"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-arm64
          path: dist/release/*.apk
          if-no-files-found: error

  release:
    name: Publish to GitHub release
    if: github.ref != 'refs/heads/android-ci'
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            . packaging/env.sh
            tag="v$VERSION"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          ls -l dist
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "FilmCraft ${TAG#v}" \
              --notes "Windows: \`.exe\` (the app), \`.msi\` (installer) or \`-portable.zip\`. Android (8.0+, 64-bit ARM): install the \`.apk\`."
          fi
          gh release upload "$TAG" dist/* --clobber
